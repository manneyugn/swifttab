<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1B4D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" rx="112" fill="#FFFFFF" opacity="0.06"/>

  <!-- Speed streaks -->
  <rect x="70" y="196" width="120" height="20" rx="10" fill="url(#streak)"/>
  <rect x="44" y="246" width="150" height="20" rx="10" fill="url(#streak)"/>
  <rect x="84" y="296" width="106" height="20" rx="10" fill="url(#streak)"/>

  <!-- Tab symbol: arrow to a bar -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <rect x="196" y="234" width="150" height="44" rx="22"/>
    <path d="M300 168 L392 256 L300 344 Q284 358 270 344 Q256 330 270 316 L332 256 L270 196 Q256 182 270 168 Q284 154 300 168 Z"/>
    <rect x="404" y="160" width="40" height="192" rx="20"/>
  </g>

  <!-- Ghost-text cursor dots -->
  <circle cx="226" cy="392" r="11" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="262" cy="392" r="11" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="298" cy="392" r="11" fill="#FFFFFF" opacity="0.3"/>
</svg>
